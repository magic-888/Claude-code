<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 80px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 3rem;
            color: #2d3748;
            margin: 0 0 16px;
        }

        p {
            font-size: 1.2rem;
            color: #718096;
            margin: 0 0 32px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #3367d6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello, World!</h1>
        <p>Welcome to my first webpage.</p>
        <a href="https://www.google.com" class="btn">Go to Google</a>
        <a href="atoms.html" class="btn" style="background-color:#2d6aa0; margin-top:12px;">Atom Jar</a>
    </div>
</body>
</html>
