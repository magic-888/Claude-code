<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Atom Jar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            color: rgba(140, 200, 255, 0.65);
            font-family: Arial, sans-serif;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        #hint {
            color: rgba(140, 180, 255, 0.3);
            font-family: Arial, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 3px;
            margin-top: 14px;
            text-align: center;
            text-transform: uppercase;
        }

        #tilt-btn {
            display: none;
            margin-top: 10px;
            padding: 7px 20px;
            background: transparent;
            border: 1px solid rgba(100, 180, 255, 0.35);
            color: rgba(140, 200, 255, 0.6);
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
        }

        #tilt-btn:hover { background: rgba(100, 180, 255, 0.08); }
    </style>
</head>
<body>
    <h1>Atom Jar</h1>
    <canvas id="canvas"></canvas>
    <p id="hint">touch &bull; tilt &bull; shake</p>
    <button id="tilt-btn">Enable Tilt</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tiltBtn = document.getElementById('tilt-btn');

        // iOS 13+ requires explicit permission
        if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
            tiltBtn.style.display = 'block';
            tiltBtn.addEventListener('click', async () => {
                const perm = await DeviceOrientationEvent.requestPermission();
                if (perm === 'granted') tiltBtn.style.display = 'none';
            });
        }

        // ── Sizing ────────────────────────────────────────────────────────
        const SIZE = Math.min(window.innerWidth * 0.88, window.innerHeight * 0.70, 500);
        canvas.width = SIZE;
        canvas.height = SIZE;

        // Outer jar
        const PAD = SIZE * 0.07;
        const JAR = { x: PAD, y: PAD, w: SIZE - PAD * 2, h: SIZE - PAD * 2, r: SIZE * 0.065 };

        // ── Physics constants ─────────────────────────────────────────────
        const BASE_R  = SIZE * 0.027;
        const N       = Math.max(45, Math.floor(SIZE * 0.115));
        const DAMPING = 0.976;
        const BOUNCE  = 0.45;
        const REP     = SIZE * 0.00078;

        // ── Collection box (open at top, sits on jar floor) ───────────────
        const WALL_T = BASE_R * 0.75;          // wall thickness
        const BOX_W  = JAR.w * 0.46;
        const BOX_H  = JAR.h * 0.29;
        const BOX = {
            x:  JAR.x + (JAR.w - BOX_W) / 2,
            y:  JAR.y + JAR.h - BOX_H,         // anchored to jar floor
            w:  BOX_W,
            h:  BOX_H,
            wt: WALL_T,
        };

        // Three solid wall rects that make up the box (open at top)
        const boxWalls = [
            { x: BOX.x,                       y: BOX.y, w: BOX.wt,  h: BOX.h },  // left wall
            { x: BOX.x + BOX.w - BOX.wt,      y: BOX.y, w: BOX.wt,  h: BOX.h },  // right wall
            { x: BOX.x, y: BOX.y + BOX.h - BOX.wt, w: BOX.w, h: BOX.wt },        // bottom wall
        ];

        // ── Gravity ───────────────────────────────────────────────────────
        let gx = 0, gy = 0.28;

        // ── Particles ─────────────────────────────────────────────────────
        const particles = Array.from({ length: N }, () => {
            const r = BASE_R * (0.82 + Math.random() * 0.36);
            return {
                x: JAR.x + r + Math.random() * (JAR.w - r * 2),
                y: JAR.y + r + Math.random() * (JAR.h * 0.50),
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 1.2,
                r,
                hue: 190 + Math.floor(Math.random() * 5) * 12,
            };
        });

        // ── Pointer tracking ──────────────────────────────────────────────
        let pointers = [];
        let mouseHeld = false;

        canvas.addEventListener('mousedown', e => { mouseHeld = true;  updateMouse(e); });
        canvas.addEventListener('mousemove', e => { if (mouseHeld) updateMouse(e); });
        window.addEventListener('mouseup',   () => { mouseHeld = false; pointers = []; });

        function updateMouse(e) {
            const rect = canvas.getBoundingClientRect();
            pointers = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
        }

        canvas.addEventListener('touchstart', e => { e.preventDefault(); syncTouches(e); }, { passive: false });
        canvas.addEventListener('touchmove',  e => { e.preventDefault(); syncTouches(e); }, { passive: false });
        canvas.addEventListener('touchend',   e => syncTouches(e));

        function syncTouches(e) {
            const rect = canvas.getBoundingClientRect();
            pointers = Array.from(e.touches).map(t => ({
                x: t.clientX - rect.left,
                y: t.clientY - rect.top,
            }));
        }

        // ── Device orientation ────────────────────────────────────────────
        window.addEventListener('deviceorientation', e => {
            if (e.beta === null) return;
            const maxG = 0.40;
            gx = clamp(Math.sin(e.gamma * Math.PI / 180) * maxG, -maxG, maxG);
            gy = clamp(Math.sin(e.beta  * Math.PI / 180) * maxG, -maxG, maxG);
        });

        // ── Shake detection ───────────────────────────────────────────────
        let lastShake = 0;
        window.addEventListener('devicemotion', e => {
            const now = Date.now();
            if (now - lastShake < 100) return;
            const acc = e.acceleration;
            if (!acc) return;
            if (Math.hypot(acc.x || 0, acc.y || 0, acc.z || 0) > 18) {
                lastShake = now;
                particles.forEach(p => {
                    p.vx += (Math.random() - 0.5) * 12;
                    p.vy += (Math.random() - 0.5) * 12;
                });
            }
        });

        // ── Box wall collision (circle vs AABB) ───────────────────────────
        function rectCollide(p, rx, ry, rw, rh) {
            const cx = clamp(p.x, rx, rx + rw);
            const cy = clamp(p.y, ry, ry + rh);
            const dx = p.x - cx, dy = p.y - cy;
            const d2 = dx * dx + dy * dy;
            if (d2 >= p.r * p.r) return;

            let nx, ny, overlap;
            if (d2 < 1e-6) {
                // Center is inside the rect — push toward nearest edge
                const dL = p.x - rx, dR = rx + rw - p.x;
                const dT = p.y - ry, dB = ry + rh - p.y;
                const m  = Math.min(dL, dR, dT, dB);
                if      (m === dL) { nx = -1; ny = 0; overlap = p.r + dL; }
                else if (m === dR) { nx =  1; ny = 0; overlap = p.r + dR; }
                else if (m === dT) { nx = 0; ny = -1; overlap = p.r + dT; }
                else               { nx = 0; ny =  1; overlap = p.r + dB; }
            } else {
                const d = Math.sqrt(d2);
                nx = dx / d; ny = dy / d;
                overlap = p.r - d;
            }

            p.x += nx * overlap;
            p.y += ny * overlap;
            const dot = p.vx * nx + p.vy * ny;
            if (dot < 0) {
                p.vx -= (1 + BOUNCE) * dot * nx;
                p.vy -= (1 + BOUNCE) * dot * ny;
            }
        }

        // Returns true if atom's centre is inside the open box interior
        function isInBox(p) {
            return p.x > BOX.x + BOX.wt &&
                   p.x < BOX.x + BOX.w - BOX.wt &&
                   p.y > BOX.y &&
                   p.y < BOX.y + BOX.h - BOX.wt;
        }

        // ── Win state ─────────────────────────────────────────────────────
        let won = false;
        let winTime = 0;

        // ── Physics update ────────────────────────────────────────────────
        function update() {
            const TOUCH_R = SIZE * 0.20;
            const TOUCH_F = 5.5;

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                p.vx += gx;
                p.vy += gy;

                // Touch / mouse repulsion
                for (const pt of pointers) {
                    const dx = p.x - pt.x, dy = p.y - pt.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < TOUCH_R * TOUCH_R && d2 > 0.01) {
                        const d = Math.sqrt(d2);
                        const f = (1 - d / TOUCH_R) * TOUCH_F;
                        p.vx += dx / d * f;
                        p.vy += dy / d * f;
                    }
                }

                // Particle-particle repulsion
                for (let j = i + 1; j < particles.length; j++) {
                    const q = particles[j];
                    const dx = p.x - q.x, dy = p.y - q.y;
                    const d2 = dx * dx + dy * dy;
                    const minD = (p.r + q.r) * 1.45;
                    if (d2 < minD * minD && d2 > 0.01) {
                        const d = Math.sqrt(d2);
                        const f = REP * (1 - d / minD);
                        const fx = dx / d * f, fy = dy / d * f;
                        p.vx += fx; p.vy += fy;
                        q.vx -= fx; q.vy -= fy;
                    }
                }

                p.vx *= DAMPING;
                p.vy *= DAMPING;
                p.x  += p.vx;
                p.y  += p.vy;

                // Jar wall bounce
                const lft = JAR.x + p.r, rgt = JAR.x + JAR.w - p.r;
                const top = JAR.y + p.r, bot = JAR.y + JAR.h - p.r;
                if (p.x < lft) { p.x = lft; p.vx =  Math.abs(p.vx) * BOUNCE; }
                if (p.x > rgt) { p.x = rgt; p.vx = -Math.abs(p.vx) * BOUNCE; }
                if (p.y < top) { p.y = top; p.vy =  Math.abs(p.vy) * BOUNCE; }
                if (p.y > bot) { p.y = bot; p.vy = -Math.abs(p.vy) * BOUNCE; }

                // Collection box wall collisions
                for (const wall of boxWalls) {
                    rectCollide(p, wall.x, wall.y, wall.w, wall.h);
                }
            }

            // Count collected and check win
            const collected = particles.filter(isInBox).length;
            if (collected === N && !won) {
                won = true;
                winTime = performance.now();
            } else if (collected < N) {
                won = false; // can un-win if atoms escape
            }
        }

        // ── Drawing ───────────────────────────────────────────────────────
        function jarPath() {
            const { x, y, w, h, r } = JAR;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drawBox() {
            const { x, y, w, h, wt } = BOX;

            // Interior fill of the box
            ctx.fillStyle = 'rgba(10, 30, 80, 0.55)';
            ctx.fillRect(x + wt, y, w - wt * 2, h - wt);

            // Draw the three open walls as glowing lines
            ctx.save();
            ctx.shadowColor = 'rgba(60, 220, 180, 0.6)';
            ctx.shadowBlur  = 8;
            ctx.strokeStyle = 'rgba(80, 230, 190, 0.80)';
            ctx.lineWidth   = wt;
            ctx.lineCap     = 'round';
            ctx.lineJoin    = 'round';

            ctx.beginPath();
            // Left wall — right wall — bottom, drawn as one open-top path
            ctx.moveTo(x + wt / 2, y);
            ctx.lineTo(x + wt / 2, y + h - wt / 2);
            ctx.lineTo(x + w - wt / 2, y + h - wt / 2);
            ctx.lineTo(x + w - wt / 2, y);
            ctx.stroke();
            ctx.restore();
        }

        function drawCounter(collected) {
            const label    = won ? '★  All collected!  ★' : `${collected} / ${N} collected`;
            const pulse    = won ? 0.7 + 0.3 * Math.sin((performance.now() - winTime) / 200) : 1;
            const alpha    = won ? pulse : 0.55;
            const color    = won
                ? `rgba(80, 255, 180, ${alpha})`
                : `rgba(140, 200, 255, ${alpha})`;

            ctx.save();
            ctx.font      = `${SIZE * 0.038}px Arial`;
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            if (won) {
                ctx.shadowColor = 'rgba(80, 255, 180, 0.8)';
                ctx.shadowBlur  = 14;
            }
            ctx.fillText(label, SIZE / 2, JAR.y + SIZE * 0.025);
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, SIZE, SIZE);

            // Jar interior background
            ctx.save();
            jarPath();
            const bg = ctx.createLinearGradient(JAR.x, JAR.y, JAR.x, JAR.y + JAR.h);
            bg.addColorStop(0, 'rgba(25, 45, 95, 0.55)');
            bg.addColorStop(1, 'rgba(8, 18, 50, 0.75)');
            ctx.fillStyle = bg;
            ctx.fill();

            // Clip everything to jar
            jarPath();
            ctx.clip();

            // Draw collection box (behind atoms)
            drawBox();

            // Draw atoms
            for (const p of particles) {
                const inBox   = isInBox(p);
                const speed   = Math.hypot(p.vx, p.vy);
                const baseHue = inBox ? 140 + (won ? 20 * Math.sin(performance.now() / 300) : 0)
                                      : p.hue;
                const hue     = baseHue + speed * 10;
                const lit     = 54 + speed * 7;
                const gr      = p.r * (1.9 + speed * 0.15);

                // Glow
                const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
                glow.addColorStop(0, `hsla(${hue}, 90%, ${lit}%, 0.28)`);
                glow.addColorStop(1, `hsla(${hue}, 90%, ${lit}%, 0)`);
                ctx.beginPath();
                ctx.arc(p.x, p.y, gr, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();

                // Sphere core
                const core = ctx.createRadialGradient(
                    p.x - p.r * 0.33, p.y - p.r * 0.33, p.r * 0.04,
                    p.x, p.y, p.r
                );
                core.addColorStop(0,    `hsla(${hue}, 65%, 90%, 1)`);
                core.addColorStop(0.38, `hsla(${hue}, 78%, 62%, 0.95)`);
                core.addColorStop(1,    `hsla(${hue + 18}, 92%, 28%, 0.88)`);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = core;
                ctx.fill();
            }

            // Counter text (inside clip so it stays within jar)
            drawCounter(particles.filter(isInBox).length);

            ctx.restore(); // remove clip

            // Jar border on top
            ctx.save();
            jarPath();
            ctx.shadowColor = 'rgba(80, 160, 255, 0.45)';
            ctx.shadowBlur  = 14;
            ctx.strokeStyle = 'rgba(110, 185, 255, 0.60)';
            ctx.lineWidth   = 2.5;
            ctx.stroke();
            ctx.shadowBlur  = 0;
            ctx.strokeStyle = 'rgba(210, 235, 255, 0.10)';
            ctx.lineWidth   = 5;
            ctx.stroke();
            ctx.restore();
        }

        function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
